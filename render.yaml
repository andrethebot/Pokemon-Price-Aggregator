# Render Blueprint: one Node web service. eBay keys are entered in the Render dashboard, not stored here.
services:
  - type: web
    name: pokemon-price-app
    runtime: node
    plan: free
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /
    envVars:
      - key: NODE_VERSION
        value: "20"
      - key: EBAY_CLIENT_ID
        sync: false
      - key: EBAY_CLIENT_SECRET
        sync: false
